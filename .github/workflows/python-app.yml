name: python-CI
on:
  push:
    branches: [main]
    paths-ignore:
    - '**/*.md'
  pull_request: {branches: [main]}
defaults: {run: {shell: 'bash -el {0}'}} # https://github.com/marketplace/actions/setup-miniconda#important
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu, macos] # windows needs https://github.com/conda-forge/howardhinnant_date-feedstock/issues/23
    environment: pypi
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0, submodules: recursive}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test on generated file
      shell: bash
      run: |
        set -ex
        python -m petsird.helpers.generator | python python/main.py -o test.ply
        # minimal test if readable output
        test -r test.ply
